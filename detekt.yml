config:
  validation: true
  warningsAsErrors: false

style:
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    active: false
  WildcardImport:
    active: false

complexity:
  LongParameterList:
    allowedFunctionParameters: 10
    allowedConstructorParameters: 12

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
